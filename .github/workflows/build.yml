name: Validate and build site
on:
  push:
    branches: [code]
  pull_request:
    branches: [code]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/publish-check.test.js
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: matter-sorted-${{ github.sha }}
          path: out/
          retention-days: 14
